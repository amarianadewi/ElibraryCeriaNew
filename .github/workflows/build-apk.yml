name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platforms;android-34"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/elibrary-ceria.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elibrary-ceria-apk
          path: android/app/build/outputs/apk/debug/elibrary-ceria.apk
          if-no-files-found: error

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "E-Library Ceria Android APK"
          body: "APK Android resmi E-Library Ceria (SDN Kaliwungu 05). Dibuat otomatis via GitHub Actions CI/CD."
          files: android/app/build/outputs/apk/debug/elibrary-ceria.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


